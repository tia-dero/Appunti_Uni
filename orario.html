<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orario</title>
<style>
@font-face{font-family:'Bricolage Grotesque';font-weight:800;font-style:normal;font-display:swap;src:url(font-bricolage-800.woff2) format('woff2')}
@font-face{font-family:'DM Sans';font-weight:400;font-style:normal;font-display:swap;src:url(font-dmsans-400.woff2) format('woff2')}
@font-face{font-family:'DM Sans';font-weight:500;font-style:normal;font-display:swap;src:url(font-dmsans-500.woff2) format('woff2')}
@font-face{font-family:'DM Sans';font-weight:700;font-style:normal;font-display:swap;src:url(font-dmsans-700.woff2) format('woff2')}

:root{
  --bg:#fff; --ink:#0B0E13; --muted:#5B6475; --slot:#EEF1F6; --line:#D5DBE6; --inv:#0B0E13; --on-inv:#fff;
  --c-ped:#FF8A6B; --c-ana:#3DD6C0; --c-chi:#FFD166; --c-bio:#B79CFF; --c-tec:#5CB8FF; --c-teo:#7BE495; --c-fis:#6C7BFF; --c-ant:#C6DC57; --c-bmc:#FF7BB5; --c-med:#D4B483;
  --display:'Bricolage Grotesque','Arial Narrow',sans-serif; --body:'DM Sans',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0E13;--ink:#F2F4F8;--muted:#9AA3B5;--slot:#171C25;--line:#2A3140;--inv:#F2F4F8;--on-inv:#0B0E13;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0E13;--ink:#F2F4F8;--muted:#9AA3B5;--slot:#171C25;--line:#2A3140;--inv:#F2F4F8;--on-inv:#0B0E13;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.35}
.ribbon{display:flex;height:10px}.ribbon span{flex:1}
.wrap{max-width:640px;margin:0 auto;padding:26px 16px 64px;display:flex;flex-direction:column;gap:22px}
.eyebrow{padding-right:58px;font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
h1{margin:6px 0 0;font-family:var(--display);font-weight:800;font-size:clamp(96px,30vw,168px);line-height:.86;letter-spacing:-.04em}
h1 i{font-style:normal}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 calc((100% - 24px)/4);min-width:76px;scroll-snap-align:start;font:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;min-height:52px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;transition:transform .15s}
.tab b{font-family:var(--display);font-size:20px;line-height:1.1;font-weight:800}
.tab span{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.tab:active{transform:scale(.96)}
.tab[aria-pressed="true"]{background:var(--inv);border-color:var(--inv);color:var(--on-inv)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.next{background:var(--inv);color:var(--on-inv);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.next .k{font-size:12px;font-weight:700;letter-spacing:.2em;opacity:.7}
.next .nm{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.01em;overflow-wrap:anywhere}
.next .wh{font-size:15px;opacity:.8;font-variant-numeric:tabular-nums}
.cd{display:flex;gap:10px}
.cd div{flex:1;background:rgba(127,127,127,.2);border-radius:16px;padding:10px 6px 8px;text-align:center}
.cd b{display:block;font-family:var(--display);font-size:38px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.cd span{font-size:10px;font-weight:700;letter-spacing:.16em;opacity:.65}
.next .pg{height:8px;border-radius:8px;background:rgba(127,127,127,.3);overflow:hidden}.next .pg i{display:block;height:100%;background:var(--on-inv);border-radius:8px}
.next>*{position:relative;z-index:1}
.next>.dot{position:absolute;z-index:0;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;opacity:.55}
.sec{display:flex;flex-direction:column;gap:12px}
.sec h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.ov{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.oc{font:inherit;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:stretch;color:var(--ink)}
.oc .col{position:relative;height:190px;background:var(--slot);border-radius:16px;overflow:hidden}
.oc .col i{position:absolute;left:4px;right:4px;border-radius:9px;transition:opacity .2s}
.oc .lb{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-align:center}
.oc .lb b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);letter-spacing:0}
.oc.today .col{outline:3px solid var(--ink);outline-offset:-3px}
.hr{display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.1em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.f{font:inherit;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-height:40px}
.f i{width:12px;height:12px;border-radius:4px}
.f[aria-pressed="true"]{border-color:var(--inv);background:var(--inv);color:var(--on-inv)}
.st{display:grid;grid-template-columns:96px 1fr 48px;gap:10px;align-items:center;font-size:14px;font-weight:700}
.st .t{height:14px;background:var(--slot);border-radius:8px;overflow:hidden}.st .t i{display:block;height:100%;border-radius:8px}
.st em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.tot{display:flex;align-items:baseline;gap:10px}
.tot b{font-family:var(--display);font-size:64px;line-height:1;font-weight:800;letter-spacing:-.03em}
.tot span{font-weight:700;color:var(--muted)}
.day{display:flex;flex-direction:column;gap:10px;scroll-margin-top:84px}
.day.past{opacity:.45}
.dh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dn{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;letter-spacing:-.03em}
.day.today .dn{background:var(--inv);color:var(--on-inv);border-radius:16px;padding:6px 14px 8px}
.dw{font-size:13px;font-weight:700;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.hrs{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted)}
.les{position:relative;display:grid;grid-template-columns:96px 1fr;gap:16px;border-radius:24px;padding:18px 18px 20px;overflow:hidden;color:#0B0E13;box-shadow:0 2px 0 rgba(11,14,19,.14),0 10px 24px -12px rgba(11,14,19,.35);animation:up .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*55ms);transition:opacity .2s}
.les.now{outline:3px solid var(--ink);outline-offset:3px}
.dim{opacity:.18}
.tm{display:flex;flex-direction:column;align-items:flex-start;font-variant-numeric:tabular-nums}
.tm b{font-family:var(--display);font-size:30px;line-height:1;font-weight:800;letter-spacing:-.02em}
.tm i{font-style:normal;font-size:20px;line-height:1.5;opacity:.5}
.tm em{font-style:normal;font-family:var(--display);font-size:22px;font-weight:800;opacity:.6;line-height:1}
.nm2{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:8px}
.n{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05;overflow-wrap:anywhere;letter-spacing:-.01em}
.n.long{font-size:22px}
.cp{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;letter-spacing:.12em;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.62)}
.chip.dark{background:#0B0E13;color:#fff}
.chip.dark::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:6px;animation:pulse 1.4s infinite}
.prog{position:absolute;left:0;bottom:0;height:6px;background:#0B0E13;border-radius:0 6px 6px 0}
.none{border-radius:20px;background:var(--slot);padding:16px 20px;color:var(--muted);font-weight:500}
.gap{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.gap::before,.gap::after{content:"";flex:1;border-top:2px dashed var(--line)}
.month{display:flex;align-items:center;gap:20px}
.month svg{flex-shrink:0;width:124px;height:124px}
.month .tx{display:flex;flex-direction:column;gap:4px;font-weight:700}
.month .tx b{font-family:var(--display);font-size:34px;line-height:1.05;font-weight:800}
.month .tx span{color:var(--muted);font-size:14px}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;font-weight:700;padding:12px 18px;min-height:46px;border-radius:999px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);cursor:pointer}
.btn.solid{background:var(--inv);border-color:var(--inv);color:var(--on-inv)}
.th{position:absolute;right:0;top:0;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;display:grid;place-items:center}
header{position:relative}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.les,.chip.dark::before{animation:none}.tab{transition:none}}
@media (max-width:380px){.les{grid-template-columns:80px 1fr;gap:12px;padding:16px}.tm b{font-size:26px}.n{font-size:24px}.n.long{font-size:20px}.st{grid-template-columns:78px 1fr 44px}}
:root,
:root:not([data-theme="light"]),
:root[data-theme="dark"]{
  --bg:#070b16;
  --ink:#eaf4ff;
  --muted:#91a4c1;
  --slot:#111a2c;
  --line:rgba(128,164,210,.24);
  --inv:#101a2d;
  --on-inv:#eafaff;
  --glow:#51e6ff;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eef4ff;
  --ink:#111a2b;
  --muted:#536681;
  --slot:#e0e9f7;
  --line:#c3d2e8;
  --inv:#101a2d;
  --on-inv:#f4fbff;
  --glow:#007da8;
  color-scheme:light;
}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse at 14% 4%,color-mix(in srgb,var(--glow) 13%,transparent),transparent 38rem),
    radial-gradient(ellipse at 96% 26%,rgba(153,105,255,.10),transparent 34rem),
    var(--bg);
  background-attachment:fixed;
}
.ribbon{height:4px;box-shadow:0 0 18px rgba(81,230,255,.35)}
.wrap{max-width:760px;gap:26px;padding-top:32px}
.eyebrow{color:var(--glow);font-size:11px;letter-spacing:.24em}
h1{color:var(--ink);text-shadow:0 0 30px color-mix(in srgb,var(--glow) 18%,transparent)}
.bar{
  border:1px solid var(--line);
  border-radius:18px;
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  box-shadow:0 12px 34px rgba(0,0,0,.18);
}
.tab{
  border-width:1px;
  border-radius:13px;
  background:color-mix(in srgb,var(--slot) 68%,var(--bg));
  transition:transform .18s,border-color .18s,box-shadow .18s,background .18s;
}
.tab:hover{border-color:var(--glow);box-shadow:0 0 18px color-mix(in srgb,var(--glow) 18%,transparent)}
.tab[aria-pressed="true"]{
  background:linear-gradient(135deg,#12334b,#17203b 75%);
  border-color:var(--glow);
  color:#eafaff;
  box-shadow:0 0 20px color-mix(in srgb,var(--glow) 24%,transparent),inset 0 0 14px rgba(81,230,255,.08);
}
.next{
  border:1px solid color-mix(in srgb,var(--glow) 46%,var(--line));
  border-radius:24px;
  background:
    radial-gradient(circle at 88% 10%,rgba(81,230,255,.14),transparent 13rem),
    linear-gradient(140deg,#111b30,#0a1020 68%);
  box-shadow:0 18px 48px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.07);
}
.next .k{color:#70e8ff;opacity:1}
.next .cd div{border:1px solid rgba(146,185,225,.18);background:rgba(93,135,184,.12)}
.next .cd b{text-shadow:0 0 16px rgba(81,230,255,.25)}
.next .pg{background:rgba(146,185,225,.2)}
.next .pg i{background:linear-gradient(90deg,#51e6ff,#a78bfa);box-shadow:0 0 12px rgba(81,230,255,.5)}
.next .dot{filter:blur(3px)}
.sec h2{color:var(--glow);font-size:11px}
.ov{gap:10px}
.oc .col{
  height:210px;
  border:1px solid var(--line);
  border-radius:14px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--slot) 85%,var(--bg)),var(--slot));
}
.oc .col i{box-shadow:0 0 12px color-mix(in srgb,currentColor 10%,transparent);opacity:.96}
.oc.today .col{outline-color:var(--glow);box-shadow:0 0 18px color-mix(in srgb,var(--glow) 18%,transparent)}
.oc .lb b{color:var(--glow)}
.f{
  border-width:1px;
  background:color-mix(in srgb,var(--slot) 56%,var(--bg));
  transition:border-color .18s,box-shadow .18s,transform .18s;
}
.f:hover{border-color:var(--glow);transform:translateY(-1px)}
.f[aria-pressed="true"]{
  background:linear-gradient(135deg,#12334b,#17203b);
  border-color:var(--glow);
  color:#eafaff;
  box-shadow:0 0 16px color-mix(in srgb,var(--glow) 20%,transparent);
}
.st .t{border:1px solid var(--line)}
.tot b{text-shadow:0 0 26px color-mix(in srgb,var(--glow) 16%,transparent)}
.day{scroll-margin-top:100px}
.dh{border-bottom:1px solid var(--line);padding-bottom:9px}
.dn{color:var(--ink)}
.day.today .dn{
  background:linear-gradient(135deg,#12334b,#17203b);
  color:#eafaff;
  box-shadow:0 0 18px color-mix(in srgb,var(--glow) 22%,transparent);
}
.les{
  border:1px solid rgba(255,255,255,.38);
  box-shadow:0 10px 26px -12px rgba(0,0,0,.5),inset 0 1px rgba(255,255,255,.35);
}
.les.now{outline-color:var(--glow);box-shadow:0 0 22px color-mix(in srgb,var(--glow) 28%,transparent),0 10px 26px -12px rgba(0,0,0,.5)}
.chip{background:rgba(255,255,255,.68);backdrop-filter:blur(8px)}
.chip.dark{background:#091323;color:#70e8ff}
.chip.dark::before{background:#70e8ff}
.prog{background:linear-gradient(90deg,#0a1727,#233a54);box-shadow:0 0 12px rgba(81,230,255,.28)}
.none{border:1px dashed var(--line);background:color-mix(in srgb,var(--slot) 72%,transparent)}
.gap{color:var(--glow);font-size:10px}
.gap::before,.gap::after{border-color:color-mix(in srgb,var(--glow) 40%,var(--line))}
.month svg circle:nth-child(2){filter:drop-shadow(0 0 5px color-mix(in srgb,var(--glow) 45%,transparent))}
.btn{
  border-width:1px;
  border-color:var(--line);
  background:color-mix(in srgb,var(--slot) 60%,var(--bg));
  transition:transform .18s,border-color .18s,box-shadow .18s;
}
.btn:hover{transform:translateY(-2px);border-color:var(--glow);box-shadow:0 0 18px color-mix(in srgb,var(--glow) 18%,transparent)}
.btn.solid{
  border-color:var(--glow);
  background:linear-gradient(135deg,#12334b,#17203b);
  color:#eafaff;
  box-shadow:0 0 18px color-mix(in srgb,var(--glow) 18%,transparent);
}
.th{background:color-mix(in srgb,var(--slot) 76%,var(--bg));border-color:var(--line);box-shadow:0 4px 16px rgba(0,0,0,.18)}
button:focus-visible{outline-color:var(--glow);box-shadow:0 0 0 5px color-mix(in srgb,var(--glow) 18%,transparent)}
@media (max-width:520px){
  .wrap{padding-top:24px;gap:22px}
  .bar{margin:0 -10px}
  .ov{gap:6px}
  .oc .col{height:170px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .tab,.f,.btn{transition:none}
}
.bar{display:flex;align-items:center;gap:10px}
.tabs{flex:1;min-width:0}
.bar-tools{display:flex;flex:0 0 auto;gap:7px}
.btn.mini{min-height:42px;padding:9px 13px;font-size:12px;white-space:nowrap}
.les{box-shadow:0 7px 18px -12px rgba(0,0,0,.36),inset 0 1px rgba(255,255,255,.28)}
.les.now{box-shadow:0 0 14px color-mix(in srgb,var(--glow) 18%,transparent),0 7px 18px -12px rgba(0,0,0,.36)}

.btn.solid{box-shadow:0 0 12px color-mix(in srgb,var(--glow) 12%,transparent)}
.today-note{margin:-12px 0 0;padding:11px 14px;border:1px solid var(--line);border-radius:13px;color:var(--muted);font-size:13px;background:color-mix(in srgb,var(--slot) 70%,transparent)}
.day.today-focus{scroll-margin-top:100px}
.day.today-focus .dh{border-color:var(--glow)}

.chip.todo{background:#081928;color:#70e8ff}
.search-panel{gap:10px}
.searchbox{display:flex;gap:8px}

  width:100%;min-width:0;min-height:46px;padding:10px 14px;border:1px solid var(--line);border-radius:13px;

}

.search-result:hover{border-color:var(--glow)}
.les.search-target{outline:3px solid var(--glow);outline-offset:4px}

<body>
<div class="ribbon" aria-hidden="true" id="ribbon"></div>
<main class="wrap" id="app">
  <header><div class="eyebrow" id="eyebrow"></div><h1 id="range"></h1><button type="button" class="th" id="th" aria-label="Cambia tema"></button></header>
  <div class="bar"><nav class="tabs" id="tabs" aria-label="Settimane"></nav><div class="bar-tools"><button type="button" class="btn mini" id="todayBtn" aria-label="Vai alle lezioni di oggi">Oggi</button><button type="button" class="btn mini" id="editBtn">Modifica orario</button></div></div>
  <div id="next" role="region" aria-label="Prossima lezione"></div>
  <p id="todayNote" class="today-note" role="status" aria-live="polite" hidden></p>
  <section class="sec search-panel" aria-labelledby="search-title"><h2 id="search-title">Cerca lezione</h2><label class="sr-only" for="search">Cerca una materia, un giorno o un orario</label><div class="searchbox"><input id="search" type="search" autocomplete="off" placeholder="Es. Anatomia, martedi, 14:00"><button type="button" class="btn mini" id="clearSearch">Pulisci</button></div><div id="searchResults" class="search-results"></div><p id="searchStatus" class="sr-only" role="status" aria-live="polite"></p></section>
  <section class="sec"><h2>La settimana</h2><div class="ov" id="ov"></div><div class="hr" id="hours"></div></section>
  <section class="sec"><h2>Ore per materia</h2><div class="tot" id="tot"></div><div class="sec" id="stats"></div><div class="chips" id="flt" aria-label="Filtra per materia"></div></section>
  <section class="sec"><h2>Avanzamento</h2><div class="month" id="month"></div></section>
  <section id="days" style="display:flex;flex-direction:column;gap:28px"></section>
  <section class="sec"><h2>Porta con te</h2><div class="tools"><button type="button" class="btn solid" id="ics">Aggiungi al calendario</button></div></section>
</main>
<script>
(function(){
var DATA_KEY='appunti-universita-v1', THEME_KEY='tema-orario';
var embedded=window.self!==window.top; if(embedded)document.body.classList.add('embedded');
var DAYS=['Luned\u00ec','Marted\u00ec','Mercoled\u00ec','Gioved\u00ec','Venerd\u00ec','Sabato','Domenica'], LET=['LUN','MAR','MER','GIO','VEN','SAB','DOM'];
var MON=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
var MS=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
var ACC=['#5CB8FF','#B79CFF','#7BE495','#FF8A6B'], PAL=10;
var WEEKS=[], COL={}, NAMES=[], ND=5, H0=8, H1=19, YEAR=new Date().getFullYear();
var now=new Date(), sel=0, anim=true, flt=null, todayFocus=false, todayMessage='';

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function norm(s){return String(s).toLocaleLowerCase('it').normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function clock(v){var p=String(v||'').split(':'),h=Number(p[0]),m=Number(p[1]||0);return Number.isFinite(h)&&Number.isFinite(m)?h+m/60:NaN;}
function hm(x){var h=Math.floor(x+1e-9),m=Math.round((x-h)*60);if(m===60){h++;m=0;}return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;}
function fh(x){return String(Math.round(x*100)/100).replace('.',',');}
function short(n){var w=n.split(/\s+/);return n.length>20&&w.length>2?w[0]:n;}
function key(d){return d.getFullYear()*10000+d.getMonth()*100+d.getDate();}
function at(dt,x){return new Date(dt.getFullYear(),dt.getMonth(),dt.getDate(),Math.floor(x+1e-9),Math.round((x-Math.floor(x+1e-9))*60));}
function date(w,i){var s=WEEKS[w].start;return new Date(s.getFullYear(),s.getMonth(),s.getDate()+i);}
function mlab(w,full){var a=date(w,0),b=date(w,6),L=full?MON:MS;return a.getMonth()===b.getMonth()?L[a.getMonth()]:L[a.getMonth()]+'\u2013'+L[b.getMonth()];}
function dim(l){return flt&&l.n!==flt?' dim':'';}

/* --- dati: legge le lezioni dall'archivio dell'app --- */
function load(){
  var schedule={};try{var d=JSON.parse(localStorage.getItem(DATA_KEY)||'{}');schedule=d.schedule||{};}catch(e){}
  var byWeek={},names={},minS=99,maxE=0,weekend=false;
  Object.keys(schedule).sort().forEach(function(k){
    var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(k);if(!m)return;
    var dt=new Date(Number(m[1]),Number(m[2])-1,Number(m[3])),idx=(dt.getDay()+6)%7,mon=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()-idx),wk=mon.getTime();
    (schedule[k]||[]).forEach(function(l){
      var s=clock(l.start),e=clock(l.end);if(!Number.isFinite(s)||!Number.isFinite(e)||e<=s||!l.subject)return;
      var name=String(l.subject),place=String(l.place||'');
      var w=byWeek[wk]||(byWeek[wk]={start:mon,days:[[],[],[],[],[],[],[]]});
      w.days[idx].push({s:s,e:e,n:name,place:place,p:/palestra/i.test(place)?1:0});
      names[name]=(names[name]||0)+(e-s);if(s<minS)minS=s;if(e>maxE)maxE=e;if(idx>=5)weekend=true;
    });
  });
  var keys=Object.keys(byWeek).map(Number).sort(function(a,b){return a-b;});
  WEEKS=[];
  if(keys.length){for(var t=keys[0];t<=keys[keys.length-1];){var d0=new Date(t),w=byWeek[t]||{start:d0,days:[[],[],[],[],[],[],[]]};w.days.forEach(function(ls){ls.sort(function(a,b){return a.s-b.s;});});WEEKS.push(w);t=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+7).getTime();}}
  NAMES=Object.keys(names).sort();COL={};NAMES.forEach(function(n,i){COL[n]='--c-'+(i%PAL);});
  ND=weekend?7:5;H0=Math.min(8,Math.floor(minS===99?8:minS));H1=Math.max(19,Math.ceil(maxE||19));
  if(WEEKS.length)YEAR=WEEKS[0].start.getFullYear();
  var k=key(now);sel=0;for(var w2=0;w2<WEEKS.length;w2++){if(k>=key(date(w2,0))&&k<=key(date(w2,6))){sel=w2;break;}if(k>key(date(w2,6)))sel=w2;}
}
function all(){var o=[];WEEKS.forEach(function(wk,w){wk.days.forEach(function(ls,i){ls.forEach(function(l){o.push({l:l,s:at(date(w,i),l.s),e:at(date(w,i),l.e)});});});});return o;}

function nextCard(){
  var L=all(),cur=null,nx=null,i;
  for(i=0;i<L.length;i++){if(now>=L[i].s&&now<L[i].e){cur=L[i];break;}}
  for(i=0;i<L.length;i++){if(L[i].s>now){nx=L[i];break;}}
  var x=cur||nx;
  if(!x)return '<div class="next"><div class="k">ORARIO</div><div class="nm">Lezioni finite</div></div>';
  var diff=Math.max(0,(cur?x.e:x.s)-now),d=Math.floor(diff/864e5),h=Math.floor(diff%864e5/36e5),m=Math.floor(diff%36e5/6e4);
  var boxes=(cur?'':'<div><b>'+d+'</b><span>GIORNI</span></div>')+'<div><b>'+h+'</b><span>ORE</span></div><div><b>'+m+'</b><span>MIN</span></div>';
  var dd=x.s,wd=DAYS[(dd.getDay()+6)%7];
  var pg=cur?'<div class="pg"><i style="width:'+Math.round((now-x.s)/(x.e-x.s)*100)+'%"></i></div>':'';
  return '<div class="next"><div class="dot" style="background:var('+COL[x.l.n]+')"></div><div class="k">'+(cur?'IN CORSO \u00b7 FINISCE TRA':'PROSSIMA LEZIONE \u00b7 TRA')+'</div><div class="cd">'+boxes+'</div><div class="nm">'+esc(x.l.n)+'</div><div class="wh">'+wd+' '+dd.getDate()+' '+MON[dd.getMonth()]+' \u00b7 '+hm(x.l.s)+'\u2013'+hm(x.l.e)+(x.l.place?' \u00b7 '+esc(x.l.place):'')+'</div>'+pg+'</div>';
}
function render(){
  if(!WEEKS.length){
    document.getElementById('app').innerHTML='<div class="empty-box"><b>Nessuna lezione in archivio</b><span>Importa un calendario .ics o aggiungi le lezioni dall\u2019orario dell\u2019app, poi riapri questa finestra.</span><button type="button" class="btn solid" id="editBtn2">Apri l\u2019orario dell\u2019app</button></div>';
    document.getElementById('editBtn2').onclick=openEditor;return;
  }
  var a=date(sel,0),b=date(sel,6),tk=key(now),n=0,wk=WEEKS[sel];
  document.getElementById('eyebrow').textContent='Orario \u00b7 '+mlab(sel,true)+' '+a.getFullYear()+' \u00b7 settimana '+(sel+1)+' di '+WEEKS.length;
  document.getElementById('range').innerHTML=a.getDate()+'\u2013'+b.getDate()+'<i style="color:'+ACC[sel%4]+'">.</i>';
  var t=document.getElementById('tabs');t.innerHTML='';
  WEEKS.forEach(function(_,w){var x=document.createElement('button');x.type='button';x.className='tab';x.innerHTML='<b>'+date(w,0).getDate()+'\u2013'+date(w,6).getDate()+'</b><span>'+mlab(w)+'</span>';x.setAttribute('aria-pressed',w===sel?'true':'false');x.onclick=function(){sel=w;todayFocus=false;todayMessage='';anim=true;render();};t.appendChild(x);});
  try{var se=t.children[sel];t.scrollLeft=se.offsetLeft-t.offsetLeft-(t.clientWidth-se.offsetWidth)/2;}catch(e){}
  document.getElementById('next').innerHTML=nextCard();
  var tn=document.getElementById('todayNote');tn.textContent=todayMessage;tn.hidden=!todayMessage;
  document.getElementById('ov').style.setProperty('--nd',ND);
  var ov='';
  for(var i=0;i<ND;i++){
    var dt=date(sel,i),blocks='';
    wk.days[i].forEach(function(l){blocks+='<i class="'+dim(l).trim()+'" style="background:var('+COL[l.n]+');top:'+((l.s-H0)/(H1-H0)*100)+'%;height:calc('+((l.e-l.s)/(H1-H0)*100)+'% - 2px)"></i>';});
    ov+='<button type="button" class="oc'+(key(dt)===tk?' today':'')+'" aria-label="Vai a '+DAYS[i]+' '+dt.getDate()+'" data-d="'+i+'"><div class="col">'+blocks+'</div><div class="lb"><b>'+dt.getDate()+'</b>'+LET[i]+'</div></button>';
  }
  var ovEl=document.getElementById('ov');ovEl.innerHTML=ov;
  document.getElementById('hours').innerHTML='<span>'+hm(H0)+'</span><span>'+hm(Math.round((H0+H1)/2))+'</span><span>'+hm(H1)+'</span>';
  [].forEach.call(ovEl.querySelectorAll('.oc'),function(el){el.onclick=function(){var d=document.getElementById('d'+el.getAttribute('data-d'));if(d)d.scrollIntoView({behavior:'smooth',block:'start'});};});
  var m={},tot=0,max=0;wk.days.forEach(function(ls){ls.forEach(function(l){m[l.n]=(m[l.n]||0)+l.e-l.s;tot+=l.e-l.s;});});
  NAMES.forEach(function(k){if(m[k]>max)max=m[k];});
  document.getElementById('tot').innerHTML='<b>'+fh(tot)+'</b><span>ore di lezione questa settimana</span>';
  var st='',fl='';
  NAMES.forEach(function(k){if(!m[k])return;
    st+='<div class="st" style="'+(flt&&flt!==k?'opacity:.25':'')+'"><span title="'+esc(k)+'">'+esc(short(k))+'</span><div class="t"><i style="width:'+(m[k]/max*100)+'%;background:var('+COL[k]+')"></i></div><em>'+fh(m[k])+' h</em></div>';
    fl+='<button type="button" class="f" data-k="'+esc(k)+'" aria-pressed="'+(flt===k)+'"><i style="background:var('+COL[k]+')"></i>'+esc(short(k))+'</button>';});
  document.getElementById('stats').innerHTML=st;
  var fe=document.getElementById('flt');fe.innerHTML=fl;
  [].forEach.call(fe.querySelectorAll('.f'),function(el){el.onclick=function(){var k=el.getAttribute('data-k');flt=flt===k?null:k;anim=false;render();};});
  var out='';
  for(var d2=0;d2<ND;d2++){
    var ls=wk.days[d2],dt2=date(sel,d2),k2=key(dt2),today=k2===tk,tt=0;
    ls.forEach(function(l){tt+=l.e-l.s;});
    out+='<div class="day'+(k2<tk?' past':'')+(today?' today':'')+(today&&todayFocus?' today-focus':'')+'" id="d'+d2+'"><div class="dh"><span class="dn">'+dt2.getDate()+'</span><span class="dw">'+DAYS[d2]+(d2===0||dt2.getDate()===1?' \u00b7 '+MS[dt2.getMonth()]:'')+'</span>'+(ls.length?'<span class="hrs">'+hm(ls[0].s)+'\u2013'+hm(ls[ls.length-1].e)+' \u00b7 '+fh(tt)+' h</span>':'')+'</div>';
    if(!ls.length)out+='<div class="none">Nessuna lezione</div>';
    ls.forEach(function(l,li){
      var s=at(dt2,l.s),e=at(dt2,l.e),on=today&&now>=s&&now<e,pct=on?Math.round((now-s)/(e-s)*100):0;
      if(li>0&&l.s>ls[li-1].e)out+='<div class="gap">Pausa '+fh(l.s-ls[li-1].e)+' h</div>';
      var upcoming=today&&todayFocus&&now<s;
      out+='<div id="lesson-'+sel+'-'+d2+'-'+li+'" class="les'+(on?' now':'')+(upcoming?' today-upcoming':'')+dim(l)+'" style="background:var('+COL[l.n]+');--i:'+(anim?n++:0)+(anim?'':';animation:none')+'"><div class="tm"><b>'+hm(l.s)+'</b><i>\u2193</i><em>'+hm(l.e)+'</em></div><div class="nm2"><span class="n'+(l.n.length>30?' long':'')+'">'+esc(l.n)+'</span><div class="cp"><span class="chip">'+fh(l.e-l.s)+' h</span>'+(l.place?'<span class="chip place">'+esc(l.place)+'</span>':'')+(on?'<span class="chip dark">IN CORSO</span>':'')+(upcoming?'<span class="chip todo">DA FARE OGGI</span>':'')+'</div></div>'+(on?'<div class="prog" style="width:'+pct+'%"></div>':'')+'</div>';
    });
    out+='</div>';
  }
  document.getElementById('days').innerHTML=out;
  var active=document.activeElement;if(!(active&&active.closest('#searchResults')))renderSearch();
  var tH=0,dH=0,left=0;all().forEach(function(x){var h=x.l.e-x.l.s;tH+=h;if(now>=x.e)dH+=h;else{if(now>x.s)dH+=(now-x.s)/36e5;left++;}});
  var C=2*Math.PI*42,f=tH?dH/tH:0;
  document.getElementById('month').innerHTML='<svg viewBox="0 0 100 100" role="img" aria-label="'+Math.round(f*100)+'% completato"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--slot)" stroke-width="12"/><circle cx="50" cy="50" r="42" fill="none" stroke="var(--ink)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(C*f).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 50 50)"/><text x="50" y="58" text-anchor="middle" font-family="Bricolage Grotesque,Arial Narrow,sans-serif" font-weight="800" font-size="26" fill="var(--ink)">'+Math.round(f*100)+'%</text></svg><div class="tx"><b>'+fh(Math.round(dH*10)/10)+' / '+fh(tH)+' h</b><span>'+left+' lezioni ancora da fare</span></div>';
}
function renderSearch(){
  var input=document.getElementById('search'),box=document.getElementById('searchResults'),status=document.getElementById('searchStatus'),q=norm(input.value.trim());
  box.innerHTML='';box.hidden=!q;if(!q){status.textContent='';return;}
  var terms=q.split(/\s+/),results=[];
  WEEKS.forEach(function(wk,w){wk.days.forEach(function(ls,d){ls.forEach(function(l,i){
    var dt=date(w,d),hay=norm(l.n+' '+l.place+' '+DAYS[d]+' '+hm(l.s)+' '+hm(l.e)+' '+dt.getDate()+' '+MON[dt.getMonth()]+' '+dt.getFullYear());
    if(terms.every(function(term){return hay.indexOf(term)>=0;}))results.push({w:w,d:d,i:i,l:l,dt:dt});
  });});});
  if(!results.length){box.innerHTML='<p class="search-empty">Nessuna lezione trovata.</p>';status.textContent='Nessuna lezione trovata.';return;}
  box.innerHTML=results.slice(0,40).map(function(r){return '<button type="button" class="search-result" data-week="'+r.w+'" data-day="'+r.d+'" data-lesson="'+r.i+'"><b>'+esc(r.l.n)+'</b><span>'+DAYS[r.d]+' '+r.dt.getDate()+' '+MON[r.dt.getMonth()]+' \u00b7 '+hm(r.l.s)+'\u2013'+hm(r.l.e)+'</span></button>';}).join('');
  status.textContent=results.length+' '+(results.length===1?'lezione trovata.':'lezioni trovate.');
  [].forEach.call(box.querySelectorAll('.search-result'),function(el){el.onclick=function(){
    sel=Number(el.getAttribute('data-week'));var d=Number(el.getAttribute('data-day')),i=Number(el.getAttribute('data-lesson'));flt=null;todayFocus=false;todayMessage='';anim=false;render();
    setTimeout(function(){var target=document.getElementById('lesson-'+sel+'-'+d+'-'+i);if(target){target.setAttribute('tabindex','-1');target.focus({preventScroll:true});target.scrollIntoView({behavior:'smooth',block:'center'});target.classList.add('search-target');setTimeout(function(){target.classList.remove('search-target');},1800);}},50);
  };});
}
function goToday(){
  var tk=key(now),found=-1,day=-1;flt=null;
  for(var w=0;w<WEEKS.length;w++)for(var d=0;d<ND;d++)if(key(date(w,d))===tk){found=w;day=d;}
  if(found>=0){sel=found;todayFocus=true;todayMessage='';}
  else{todayFocus=false;sel=WEEKS.length-1;for(var j=0;j<WEEKS.length;j++)if(key(date(j,6))>=tk){sel=j;break;}todayMessage='Oggi non sono previste lezioni. Mostro la settimana pi\u00f9 vicina presente nell\u2019orario.';}
  anim=false;render();
  var target=found>=0?document.getElementById('d'+day):document.getElementById('next');
  if(target){target.setAttribute('tabindex','-1');target.focus({preventScroll:true});target.scrollIntoView({behavior:'smooth',block:'start'});}
}
function theme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem(THEME_KEY,t);}catch(e){}
  document.getElementById('th').innerHTML=t==='dark'?'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';}
function p2(n){return (n<10?'0':'')+n;}
function ics(){
  var f=function(d){return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'T'+p2(d.getHours())+p2(d.getMinutes())+'00';};
  var esc2=function(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,');};
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Appunti universita//Orario//IT','CALSCALE:GREGORIAN'];
  var st=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  all().forEach(function(x,i){L.push('BEGIN:VEVENT','UID:orario-'+i+'-'+f(x.s)+'@appunti-universita','DTSTAMP:'+st,'DTSTART:'+f(x.s),'DTEND:'+f(x.e),'SUMMARY:'+esc2(x.l.n));if(x.l.place)L.push('LOCATION:'+esc2(x.l.place));L.push('END:VEVENT');});
  L.push('END:VCALENDAR');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\r\n')+'\r\n'],{type:'text/calendar'}));a.download='orario-lezioni.ics';document.body.appendChild(a);a.click();a.remove();
}
function openEditor(){if(embedded){try{window.parent.postMessage({appunti:'open-schedule-editor'},location.origin);}catch(e){}}else{location.href='index.html';}}
function go(d){var w=sel+d;if(w>=0&&w<WEEKS.length){sel=w;todayFocus=false;todayMessage='';anim=true;render();}}

(function(){var rb=document.getElementById('ribbon'),cols=['#FF8A6B','#FFD166','#C6DC57','#7BE495','#3DD6C0','#5CB8FF','#6C7BFF','#B79CFF','#FF7BB5','#D4B483'];rb.innerHTML=cols.map(function(c){return '<span style="background:'+c+'"></span>';}).join('');})();
(function(){var t=null;try{t=localStorage.getItem(THEME_KEY);}catch(e){}if(!t)t='dark';theme(t);document.getElementById('th').onclick=function(){theme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');};})();
load();
document.getElementById('ics').onclick=ics;
document.getElementById('todayBtn').onclick=goToday;
document.getElementById('editBtn').onclick=openEditor;
document.getElementById('search').addEventListener('input',renderSearch);
document.getElementById('clearSearch').onclick=function(){var input=document.getElementById('search');input.value='';renderSearch();input.focus();};
document.addEventListener('keydown',function(e){if(e.target&&(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){go(e.key==='ArrowRight'?1:-1);var active=document.querySelector('.tab[aria-pressed="true"]');if(active&&document.activeElement&&document.activeElement.classList.contains('tab'))active.focus();}});
var sx=0,sy=0,app=document.getElementById('app');
app.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
app.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dy)<45)go(dx<0?1:-1);},{passive:true});
render();
setInterval(function(){now=new Date();anim=false;load2();},30000);
function load2(){var k=sel;render();sel=k;}
})();
</script>
</body>
</html>
